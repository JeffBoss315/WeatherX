# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write runtime config
        # config.js is gitignored, so a deployed build would otherwise have no
        # credentials and would just render its setup message. Prefer the
        # Worker proxy: with it the key stays server-side. A direct key ends up
        # in the deployed JavaScript, where any visitor can read it.
        env:
          PROXY_URL: ${{ vars.WEATHERX_PROXY_URL }}
          API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
        run: |
          if [ -n "$PROXY_URL" ]; then
            echo "Proxy mode: the API key stays on the Worker."
          elif [ -n "$API_KEY" ]; then
            echo "::warning::Deploying with a direct API key. Any visitor can read it in DevTools. Set the WEATHERX_PROXY_URL variable to a deployed Worker to keep it private."
          else
            echo "::warning::Neither the WEATHERX_PROXY_URL variable nor the OPENWEATHER_API_KEY secret is set, so the site will show its setup message."
          fi
          {
            echo "/* Generated at deploy time by .github/workflows/static.yml. */"
            echo "window.WEATHERX = {"
            echo "  proxyUrl: \"$PROXY_URL\","
            echo "  apiKey: \"$API_KEY\","
            echo "};"
          } > config.js

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
